name: stig-aws-ecr-v2r4
title: AWS Container Platform Baseline (DISA Container Platform SRG V2R4)
maintainer: Risk Sentinel
copyright: Risk Sentinel
copyright_email: support@risk-sentinel.org
license: Apache-2.0
summary: |
  Tier-2 InSpec baseline implementing the DISA Container Platform Security
  Requirements Guide (SRG) V2R4 — all 188 requirements — tailored for the AWS
  container platform.

  Scaffolded from the SRG XCCDF via MITRE SAF `generate inspec_profile`
  (SRG-APP-…-CTR-… control IDs preserved for 1:1 traceability, same stub-from-
  XCCDF approach used for the CIS profiles), then tailored per the AWS
  shared-responsibility model. Every control is dispositioned via
  `implementation_status`:

  - `implemented` — registry requirements asserted against Amazon ECR
    (scan-on-push, enhanced scanning, tag immutability, repository/registry
    permissions, lifecycle, encryption, image findings) — the primary
    automated coverage; the focus of this repo.
  - `inherited` — satisfied by the AWS-managed runtime, host OS, and
    orchestrator control plane (AWS the cloud-provider authorization); passes with evidence.
  - `not-applicable` / `alternative` — deployment-/governance-specific
    requirements rendered N/A or carrying a SAF attestation.

  Note: ECR coverage here is account-wide and stands alone; the
  `aws-ecs-fargate-baseline` separately re-validates the registry posture of
  the repos backing its own workloads (each profile stands alone).

  Targets AWS Commercial (aws) and AWS GovCloud non-organization (aws-us-gov);
  behaviour tuned via inputs. Built for any consumer.
version: 0.1.0
inspec_version: '>= 5.0'

supports:
  - platform: aws

depends:
  - name: inspec-aws
    git: https://github.com/inspec/inspec-aws.git
    tag: v1.83.63

inputs:
  - name: aws_partition
    type: string
    value: aws                 # aws | aws-us-gov
  - name: scan_regions
    type: array
    value: []                  # REQUIRED. ECR is regional: each region has its own
                               # registry, so a repository elsewhere is simply never
                               # seen and the control passes having found nothing.
                               # Empty is an ERROR, not a fallback. Use ["*"] to
                               # sweep every enabled region in the partition.
  - name: assessed_repositories
    type: array
    value: []                  # optional allowlist of ECR repo names; empty = all in-account repos
  - name: excluded_repositories
    type: array
    value: []                  # repos to drop from scoring (e.g. third-party/archived); applied on top of the default account-wide scan
  - name: max_image_finding_severity
    type: string
    value: HIGH  # above this => fail; an unscanned image also fails (fail-closed)
  - name: require_enhanced_scanning
    type: boolean
    value: true  # true => ENHANCED (Inspector) required; false => BASIC accepted
  - name: require_kms_cmk_encryption
    type: boolean
    value: true  # true => repos must use a KMS CMK; false => AWS-managed AES256 accepted
  - name: trusted_registry_account_ids
    type: array
    value: []                  # account IDs whose ECR registries are approved image sources
  - name: leveraged_evidence_base
    type: string
    value: ''  # base URI for the leveraged the cloud-provider authorization manifest (inherited evidence)
  - name: inherited_evidence_uri
    type: string
    value: ''  # explicit override URI for the inherited-evidence manifest
  - name: leveraged_evidence_max_age_days
    type: numeric
    value: 365
  - name: pw_min_length
    type: numeric
    value: 15  # organization minimum password length
